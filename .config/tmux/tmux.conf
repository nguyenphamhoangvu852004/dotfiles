

# ==========================================
# TMUX - Developer Configuration
# ==========================================

# General
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# True color support
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# ==========================================
# Pane Management
# ==========================================

# Split panes
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigate panes using Vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Zoom current pane
bind z resize-pane -Z

# ==========================================
# Window Management
# ==========================================

# Create new window in current directory
bind c new-window -c "#{pane_current_path}"

# Switch windows
bind -r n next-window
bind -r p previous-window

# ==========================================
# Copy Mode - Vim
# ==========================================

setw -g mode-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# ==========================================
# Clipboard - Wayland
# ==========================================

set -g set-clipboard on

# ==========================================
# Reload Configuration
# ==========================================

bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# ==========================================
# Status Bar
# ==========================================

set -g status-position bottom
set -g status-interval 5
set -g status-justify left

set -g status-left-length 30
set -g status-right-length 60

set -g status-left " #S "
set -g status-right " %Y-%m-%d %H:%M "

setw -g window-status-format " #I:#W "
setw -g window-status-current-format " [#I:#W] "

# ==========================================
# Appearance
# ==========================================

set -g status-style "bg=default,fg=colour245"
set -g window-status-current-style "fg=colour81,bold"
set -g window-status-style "fg=colour245"

set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour81"

set -g message-style "bg=colour238,fg=white"
set -g display-panes-active-colour "colour81"
set -g display-panes-colour "colour245"

# ==========================================
# Startup
# ==========================================

set -g detach-on-destroy off

set -g default-shell /run/current-system/sw/bin/zsh
